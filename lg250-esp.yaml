# Pichler LG250 ESPHome Configuration (LG40 via RS232)
# ====================================================
# This node connects an ESP32 to a Pichler LG250 controller (Hermes LG40)
# using the WR3223-compatible command interface over UART.
#
# Purpose:
# - Read core operating values (temperatures, airflow, filter runtime, hours)
# - Expose entities to Home Assistant via native ESPHome API
# - Optionally write fan level commands when controller timing allows
#
# Wiring (ESP32 <-> LG40 board):
# - GPIO17 (TX) -> RX on LG40 board
# - GPIO16 (RX) -> TX on LG40 board
# - GND must be shared between ESP32 and controller board
#
# Serial settings:
# - Baud rate: 9600
# - Data bits: 7
# - Parity: EVEN
# - Stop bits: 1
#
# Notes:
# - Entity names are intentionally in German for Home Assistant usability.
# - Comments/documentation are in English for maintenance consistency.
# - Some commands are marked as "(Test)" until verified on this specific unit.

esphome:
  name: lg250-esp
  friendly_name: LG250 ESP

# Replace this with your actual platform if you aren't using ESP32.
esp32:
  board: esp32dev

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: LG250 ESP Fallback Hotspot
    password: "XhiajwUeN6m6"

captive_portal:

# Aktiviert das modernste v3 Webinterface fuer Live-Abgleiche im Browser
web_server:
  port: 80
  version: 3

# Speichert die Betriebsstunden permanent im Flash des ESP32 ab
globals:
  - id: global_betriebsstunden
    type: float
    restore_value: yes
    initial_value: '0.0'

# Holt sich die aktuelle Uhrzeit für korrekte Zeit-Intervalle
time:
  - platform: sntp
    id: sntp_time

external_components:
  - source:
      type: git
      url: https://github.com/gelbetomate/40LG040100
      ref: main
    components: [40lg040100]
    refresh: always

uart:
  - id: uart_bus
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    data_bits: 7
    parity: EVEN
    stop_bits: 1

40lg040100:
  id: my_lg250_controller  # <-- DIESE ID HIER ERGÄNZEN
  uart_id: uart_bus
  restore_attempts: 5
  enable_unsafe_writes: true
  enable_rs_handshake: true

sensor:
  - platform: 40lg040100
    sensors_custom:
      - command: "T1"
        name: "LG250 T1 Verdampfertemperatur"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "T2"
        name: "LG250 T2 Kondensatortemperatur"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "T3"
        name: "LG250 T3 Aussentemperatur"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "T4"
        name: "LG250 T4 Ablufttemperatur Raum"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "T5"
        name: "LG250 T5 Nach Waermetauscher Fortluft"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "T6"
        name: "LG250 T6 Zulufttemperatur"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "NA"
        name: "LG250 V2-M2 Abluftventilator Drehzahl"
        unit_of_measurement: "rpm"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 30s

      - command: "NZ"
        name: "LG250 V1-M1 Zuluftventilator Drehzahl"
        id: lg250_v1_m1_zuluftventilator_drehzahl
        unit_of_measurement: "rpm"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 30s

      - command: "UA"
        name: "LG250 Steuerspannung Abluft"
        unit_of_measurement: "V"
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 60s
        id: lg250_ua_volt

      - command: "UZ"
        name: "LG250 Steuerspannung Zuluft"
        unit_of_measurement: "V"
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 60s

      - command: "RA"
        name: "LG250 Rueckwaermzahl"
        unit_of_measurement: "%"
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 60s

      - command: "L1"
        name: "LG250 L1-S1 Sollwert Lueftungsstufe 1"
        unit_of_measurement: "%"
        accuracy_decimals: 0
        update_interval: 2min

      - command: "L2"
        name: "LG250 L2-S2 Sollwert Lueftungsstufe 2"
        unit_of_measurement: "%"
        accuracy_decimals: 0
        update_interval: 2min

      - command: "L3"
        name: "LG250 L3-S3 Sollwert Lueftungsstufe 3"
        unit_of_measurement: "%"
        accuracy_decimals: 0
        update_interval: 2min

      - command: "V1"
        name: "LG250 V1 Zuluftventilator Status (Test)"
        unit_of_measurement: "rpm"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 60s

      - command: "V2"
        name: "LG250 V2 Abluftventilator Status (Test)"
        unit_of_measurement: "rpm"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 60s

      - command: "M1"
        name: "LG250 M1 Zuluftventilator Prozent (Test)"
        unit_of_measurement: "%"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 60s

      - command: "M2"
        name: "LG250 M2 Abluftventilator Prozent (Test)"
        unit_of_measurement: "%"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 60s

      - command: "F1"
        name: "LG250 F1 Volumenstrom Zuluft (Test)"
        unit_of_measurement: "m3/h"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 60s

      - command: "F2"
        name: "LG250 F2 Volumenstrom Abluft (Test)"
        unit_of_measurement: "m3/h"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 60s

      - command: "FH"
        name: "LG250 FH Filterbetriebsstunden (Test)"
        unit_of_measurement: "h"
        state_class: total_increasing
        accuracy_decimals: 0
        update_interval: 2min

      - command: "FR"
        name: "LG250 FR Filterlaufzeit Indikator (Test)"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 2min

      - command: "S1"
        name: "LG250 S1 Sollwert Lueftungsstufe 1 (Test)"
        unit_of_measurement: "%"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 2min

      - command: "S2"
        name: "LG250 S2 Sollwert Lueftungsstufe 2 (Test)"
        unit_of_measurement: "%"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 2min

      - command: "S3"
        name: "LG250 S3 Sollwert Lueftungsstufe 3 (Test)"
        unit_of_measurement: "%"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 2min

  # Berechnet die Gesamtbetriebsstunden basierend auf dem setzbaren Global-Wert
  - platform: template
    name: "LG250 Gesamtbetriebsstunden"
    unit_of_measurement: "h"
    icon: "mdi:counter"
    state_class: total_increasing
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      // Sicherheitscheck: Nur bei gültigem Messwert hochzählen.
      float ua = id(lg250_ua_volt).state;
      if (ua > 0.1f && !std::isnan(ua) && !std::isinf(ua)) {
        // 60 Sekunden / 3600 Sekunden pro Stunde
        id(global_betriebsstunden) += (60.0 / 3600.0);
      }
      return id(global_betriebsstunden);

text_sensor:
  - platform: 40lg040100
    text_sensors_custom:
      - command: "LS"
        name: "LG250 LS Aktuelle Lueftungsstufe"
        id: lg250_ls_raw
        update_interval: 30s

      - command: "ER"
        name: "LG250 ER Fehler Register Roh"
        id: lg250_er_raw
        update_interval: 60s

      - command: "ST"
        name: "LG250 ST Status Register Roh (Test)"
        id: lg250_st_sensor
        update_interval: 60s

      - command: "MO"
        name: "LG250 MO Betriebsmodus Roh (Test)"
        update_interval: 60s

      - command: "BY"
        name: "LG250 BY Bypass Modus Roh (Test)"
        update_interval: 60s

      - command: "HP"
        name: "LG250 HP Waermepumpe Kompressor Roh (Test)"
        update_interval: 60s

      - command: "HZ"
        name: "LG250 HZ Zusatzheizung Vorheizregister Roh (Test)"
        update_interval: 60s
       

  - platform: template
    name: "LG250 ST Klartext Diagnose"
    icon: "mdi:text-box-search-outline"
    update_interval: 60s
    lambda: |-
      std::string raw_st = id(lg250_st_sensor).state;
      int val = atoi(raw_st.c_str());
      std::string result = "";
      if (val & 4)   result += "Bit4 (Bypass?) | ";
      if (val & 8)   result += "STOERUNG! | ";
      if (val & 16)  result += "Bit16 | ";
      if (val & 32)  result += "Luefter EIN | ";
      if (result == "") return {"Anlage im Standby"};
      return result.substr(0, result.length() - 3);

  - platform: template
    name: "LG250 ER Fehlerdiagnose"
    icon: "mdi:alert-circle-outline"
    update_interval: 60s
    lambda: |-
      std::string raw = id(lg250_er_raw).state;
      if (raw.empty()) return {"Unbekannt"};
      char *endp = nullptr;
      long val = std::strtol(raw.c_str(), &endp, 10);
      if (endp == raw.c_str()) return {"Unlesbar: " + raw};
      if (val == 0) return {"Kein Fehler"};
      if (val == 0x81) return {"STOERUNG: Drehzahldifferenz (delta_n)"};
      if (val == 0x80) return {"STOERUNG: Zuluftventilator / n500"};
      if (val == 0x84) return {"STOERUNG: Abluftventilator"};
      if (val == 0x82) return {"STOERUNG: Kondensatorfehler"};
      if (val == 0x04) return {"STOERUNG: HD-Fehler"};
      if (val == 0x85) return {"STOERUNG: Vorheizregister"};
      static const char* snamen[] = {"?","Verdampfer T1","Kondensator T2","Aussen T3","T4","Fortluft T5","Zuluft T6","EWT T7","VHR T8"};
      if ((val & 0xF0) == 0x30) {
        int y = val & 0x0F;
        return {"STOERUNG: Unterbrechung " + std::string((y >= 1 && y <= 8) ? snamen[y] : "unbekannt")};
      }
      if ((val & 0xF0) == 0x10) {
        int y = val & 0x0F;
        return {"STOERUNG: Kurzschluss " + std::string((y >= 1 && y <= 8) ? snamen[y] : "unbekannt")};
      }
      return {"STOERUNG: Code " + raw};

  # NEUER TEXT-SENSOR: Übersetzt den Status inkl. der Grundlüftung
  - platform: template
    name: "LG250 Betriebsstatus Detail"
    icon: "mdi:fan-clock"
    update_interval: 30s
    lambda: |-
      std::string raw_ls = id(lg250_ls_raw).state;
      int level = -1;
      if (!raw_ls.empty()) {
        char *end = nullptr;
        long parsed = std::strtol(raw_ls.c_str(), &end, 10);
        if (end != raw_ls.c_str() && *end == '\0') {
          level = static_cast<int>(parsed);
        }
      }

      // Manuell: Stufe 1 bis 3
      if (level == 1) return {"Manuell - Stufe 1"};
      if (level == 2) return {"Manuell - Stufe 2"};
      if (level == 3) return {"Manuell - Stufe 3"};

      // Automatik: Bei Level 4 echte Drehzahl auswerten.
      if (level == 4) {
        float rpm = id(lg250_v1_m1_zuluftventilator_drehzahl).state;

        if (rpm < 100.0f) {
          return {"Automatik - Standby"};
        } else if (rpm <= 950.0f) {
          return {"Automatik - Grundlüftung"};
        } else if (rpm <= 1500.0f) {
          return {"Automatik - Normalbetrieb"};
        } else {
          return {"Automatik - Bedarfslüftung"};
        }
      }

      // Fallback: bekannte Muster ohne vollständige Zahl.
      if (raw_ls.find("1") != std::string::npos) return {"Manuell - Stufe 1"};
      if (raw_ls.find("2") != std::string::npos) return {"Manuell - Stufe 2"};
      if (raw_ls.find("3") != std::string::npos) return {"Manuell - Stufe 3"};
      if (raw_ls.find("4") != std::string::npos) return {"Automatik - Betrieb"};

      return {"Unbekannter Status"};

binary_sensor:
  - platform: 40lg040100
    relais_sensors:
      kompressor:
        name: "LG250 Kompressor"
      zusatzheizung:
        deactivate: true
      erdwaermetauscher:
        deactivate: true
      bypass:
        name: "LG250 Bypass"
      vorheizregister:
        name: "LG250 Status Vorheizregister"
      netzrelais_bypass:
        deactivate: true
      bedienteil_aktiv:
        name: "LG250 Bedienteil aktiv"
      bedienung_via_rs:
        name: "LG250 Bedienung via RS"
      luftstufe_vorhanden:
        deactivate: true
      ww_nachheizregister:
        name: "LG250 Warmwasser Nachheizregister"
      magnetventil:
        name: "LG250 Magnetventil"
      vorheizen_aktiv:
        deactivate: true

select:
  - platform: 40lg040100
    selects:
      ventilation_level:
        name: "LG250 Manuelle Stufenwahl"
        options:
          - "Aus"
          - "Luftstufe 1"
          - "Luftstufe 2"
          - "Luftstufe 3"
          - "Automatik"
      operation_mode:
        name: "LG250 Betriebsmodus"
        options:
          - "Aus"
          - "Sommerbetrieb"
          - "Sommerbetrieb Abluft"
          - "Winterbetrieb"
          - "Handbetrieb Winterbetrieb"

number:
  - platform: 40lg040100
    numbers:
      room_target:
        name: "LG250 Raum-Solltemperatur"
        min_value: 10
        max_value: 30
        step: 1

  - platform: template
    name: "LG250 Betriebsstunden vom Display eintragen"
    icon: "mdi:counter"
    min_value: 0
    max_value: 999999
    step: 1
    mode: box
    lambda: |-
      return id(global_betriebsstunden);
    set_action:
      - lambda: |-
          id(global_betriebsstunden) = x;
          ESP_LOGI("main", "Betriebsstunden manuell mit Display synchronisiert.");


