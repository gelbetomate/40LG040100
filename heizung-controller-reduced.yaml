# Pichler LG250 ESPHome Reduced Configuration
# Nur aktuell validierte/antwortende Werte aus den Logs

esphome:
  name: lg250-esp
  friendly_name: LG250 ESP

esp32:
  board: esp32dev

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: LG250 ESP Fallback Hotspot
    password: "XhiajwUeN6m6"

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/gelbetomate/40LG040100
      ref: main
    components: [40lg040100]
    refresh: always

uart:
  - id: uart_bus
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    data_bits: 7
    parity: EVEN
    stop_bits: 1

40lg040100:
  uart_id: uart_bus
  reference_profile: lg250
  restore_attempts: 5
  enable_unsafe_writes: false

sensor:
  - platform: 40lg040100
    sensors_custom:
      # Laut Log valide und numerisch
      - command: "T1"
        name: "LG250 T1 Verdampfertemperatur"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T2"
        name: "LG250 T2 Kondensatortemperatur"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T3"
        name: "LG250 T3 Aussentemperatur"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T4"
        name: "LG250 T4 Ablufttemperatur Raum"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T5"
        name: "LG250 T5 Nach Waermetauscher Fortluft"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "ER"
        name: "LG250 Fehlercode Leistungsteil Rohwert"
        update_interval: 60s

binary_sensor:
  - platform: 40lg040100
    relais_sensors:
      kompressor:
        name: "LG250 Kompressor"
      zusatzheizung:
        name: "LG250 Zusatzheizung"
      erdwaermetauscher:
        name: "LG250 Erdwaermetauscher"
      bypass:
        name: "LG250 Bypass"
      vorheizregister:
        name: "LG250 Vorheizregister"
      netzrelais_bypass:
        deactivate: true
      bedienteil_aktiv:
        name: "LG250 Bedienteil aktiv"
      bedienung_via_rs:
        name: "LG250 Bedienung via RS"
      luftstufe_vorhanden:
        deactivate: true
      ww_nachheizregister:
        name: "LG250 Warmwasser Nachheizregister"
      magnetventil:
        name: "LG250 Magnetventil"
      vorheizen_aktiv:
        deactivate: true
