# Pichler LG250 ESPHome Reduced Configuration
# Only values currently validated as responsive in logs.

esphome:
  name: lg250-esp
  friendly_name: LG250 ESP

esp32:
  board: esp32dev

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: LG250 ESP Fallback Hotspot
    password: "XhiajwUeN6m6"

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/gelbetomate/40LG040100
      ref: main
    components: [40lg040100]
    refresh: always

uart:
  - id: uart_bus
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    data_bits: 7
    parity: EVEN
    stop_bits: 1

40lg040100:
  uart_id: uart_bus
  reference_profile: lg250
  restore_attempts: 5
  enable_unsafe_writes: false

sensor:
  - platform: 40lg040100
    sensors_custom:
      # Valid numeric values according to the logs.
      - command: "T1"
        # English: Exhaust air temperature (exhaust air path FO).
        name: "LG250 T1 Fortlufttemperatur (Fortluft FO)"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "T2"
        # English: Supply air temperature (supply air path ZU).
        name: "LG250 T2 Zulufttemperatur (Zuluft ZU)"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "T3"
        # English: Outside air temperature.
        name: "LG250 T3 Aussentemperatur"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "T4"
        # English: Extract air / room exhaust temperature.
        name: "LG250 T4 Ablufttemperatur Raum"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "T5"
        # English: Exhaust air temperature after the heat exchanger.
        name: "LG250 T5 Nach Waermetauscher Fortluft"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 30s

      - command: "NA"
        # English: Extract fan speed.
        name: "LG250 Drehzahl Abluft"
        unit_of_measurement: "rpm"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 30s

      - command: "NZ"
        # English: Supply fan speed.
        name: "LG250 Drehzahl Zuluft"
        unit_of_measurement: "rpm"
        state_class: measurement
        accuracy_decimals: 0
        update_interval: 30s

      - command: "UA"
        # English: Extract fan control voltage.
        name: "LG250 Steuerspannung Abluft"
        unit_of_measurement: "V"
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 60s

      - command: "UZ"
        # English: Supply fan control voltage.
        name: "LG250 Steuerspannung Zuluft"
        unit_of_measurement: "V"
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 60s

      - command: "RA"
        # English: Heat-recovery ratio.
        name: "LG250 Rueckwaermzahl"
        unit_of_measurement: "%"
        state_class: measurement
        accuracy_decimals: 1
        update_interval: 60s

      - command: "LS"
        # English: Current ventilation level.
        name: "LG250 Aktuelle Luftstufe"
        accuracy_decimals: 0
        update_interval: 30s

      - command: "L1"
        # English: Ventilation level 1 setpoint.
        name: "LG250 Luftstufe 1 Sollwert"
        unit_of_measurement: "%"
        accuracy_decimals: 0
        update_interval: 2min

      - command: "L2"
        # English: Ventilation level 2 setpoint.
        name: "LG250 Luftstufe 2 Sollwert"
        unit_of_measurement: "%"
        accuracy_decimals: 0
        update_interval: 2min

      - command: "L3"
        # English: Ventilation level 3 setpoint.
        name: "LG250 Luftstufe 3 Sollwert"
        unit_of_measurement: "%"
        accuracy_decimals: 0
        update_interval: 2min

      - command: "ER"
        # English: Raw controller error code.
        name: "LG250 Fehlercode Leistungsteil Rohwert"
        accuracy_decimals: 0
        update_interval: 60s

binary_sensor:
  - platform: 40lg040100
    relais_sensors:
      kompressor:
        # English: Compressor.
        name: "LG250 Kompressor"
      zusatzheizung:
        # English: Additional heating.
        name: "LG250 Zusatzheizung"
      erdwaermetauscher:
        # English: Ground heat exchanger.
        name: "LG250 Erdwaermetauscher"
      bypass:
        # English: Bypass.
        name: "LG250 Bypass"
      vorheizregister:
        # English: Preheater.
        name: "LG250 Vorheizregister"
      netzrelais_bypass:
        deactivate: true
      bedienteil_aktiv:
        # English: Control panel active.
        name: "LG250 Bedienteil aktiv"
      bedienung_via_rs:
        # English: Control via RS interface.
        name: "LG250 Bedienung via RS"
      luftstufe_vorhanden:
        deactivate: true
      ww_nachheizregister:
        # English: Domestic-hot-water reheater.
        name: "LG250 Warmwasser Nachheizregister"
      magnetventil:
        # English: Solenoid valve.
        name: "LG250 Magnetventil"
      vorheizen_aktiv:
        deactivate: true
