esphome:
  name: heizung-controller-20
  friendly_name: heizung-controller_2.0

esp32:
  board: az-delivery-devkit-v4
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

external_components:
  - source: "./components"
 # - source: 
 #   type: git
 #   url: "https://github.com/gelbetomate/40LG040100"
 #   ref: "main"
    components: [40lg040100]

# Enable Home Assistant API
api:
  encryption:
    key: "Bg1mLRzoqGjz44FpXNj4wLg5iIssG9N0Yjm8g6INzuY="

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Heizung-Controller-20"
    password: "ImZyhAj3rZmt"

  manual_ip:
    static_ip: 192.168.178.199
    gateway: 192.168.1.1
    subnet: 255.255.255.0

uart:
  - id: uart_bus
    tx_pin: GPIO19
    rx_pin: GPIO18
    baud_rate: 9600
    data_bits: 7
    parity: EVEN
    stop_bits: 1

40lg040100:
  uart_id: uart_bus
  enable_unsafe_writes: false

# Sensoren
sensor:
  - platform: 40lg040100
    reference_profile: lg250
    sensors: # hier alle sensoren mit bekannten kommandos (diese haben standardwerte)
      T1:
        name: "Verdampfertemperatur"
      T2:
        deactivate: true
      T3:
        update_interval: "15s"
    sensors_custom: # hier eigene kommando, diese erfordern weitere angaben
      - command: "XZ"
        name: "Custom-Kommand"
        unit_of_measurement: V
        device_class: temperature
      # Kandidaten aus Community-Referenzen (Read-first)
      - command: "LS"
        name: "Luftstufe (Raw)"
        unit_of_measurement: "level"
      - command: "L1"
        name: "Luftmenge Stufe 1"
        unit_of_measurement: "%"
      - command: "L2"
        name: "Luftmenge Stufe 2"
        unit_of_measurement: "%"
      - command: "L3"
        name: "Luftmenge Stufe 3"
        unit_of_measurement: "%"
      - command: "NZ"
        name: "Zuluft Drehzahl"
        unit_of_measurement: "rpm"
        device_class: frequency
      - command: "NA"
        name: "Abluft Drehzahl"
        unit_of_measurement: "rpm"
        device_class: frequency

text_sensor:
  - platform: 40lg040100
    reference_profile: lg250
    text_sensors_custom:
      - command: "ER"
        name: "Error Register Raw"
      - command: "ST"
        name: "Status Register Raw"
      - command: "MD"
        name: "Mode Register Raw"
      - command: "SW"
        name: "Status-Write Register Raw"
      - command: "RL"
        name: "Relais Register Raw"


# Binär-Sensoren
binary_sensor:
  - platform: 40lg040100
    relais_sensors:
      zusatzheizung:
        deactivate: true # Dieser Sensor wird nicht erstellt
      kompressor:
        name: "Anderer Name"
        entity_category: "diagnostic"
        device_class: "power"  # Falls gewünscht, kann die `device_class` überschrieben werden        
      bypass:
        name: "Relais: Bypass"
        entity_category: "config"

select:
  - platform: 40lg040100

switch:
  - platform: 40lg040100

number:
  - platform: 40lg040100
    numbers:
      supply_air_setpoint:
        name: "Zuluftsolltemperatur (SP)"
      supply_air_target:
        name: "Zulufttemperatur Sollwert (Re)"
      room_target:
        name: "Raumsollwert (Rd)"
      supply_fan_trim:
        name: "Zuluft +/- (LD)"
      exhaust_fan_trim:
        name: "Abluft +/- (Ld)"
      heat_pump_release:
        name: "Waermepumpe frei (WP)"
      additional_heating_release:
        name: "Zusatzheizung frei (ZH)"
      additional_heating_enable:
        name: "Zusatzheizung ein (ZE)"
      water_setpoint:
        name: "Warmwasser Sollwert (WS)"
      speed_limit:
        name: "Grenzdrehzahl (NM)"


