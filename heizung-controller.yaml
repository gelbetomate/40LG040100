# Pichler LG250 ESPHome Configuration (LG40 via RS232)
# ====================================================
# This node connects an ESP32 to a Pichler LG250 controller (Hermes LG40)
# using the WR3223-compatible command interface over UART.
#
# Purpose:
# - Read core operating values (temperatures, airflow, filter runtime, hours)
# - Expose entities to Home Assistant via native ESPHome API
# - Optionally write fan level commands when controller timing allows
#
# Wiring (ESP32 <-> LG40 board):
# - GPIO17 (TX) -> RX on LG40 board
# - GPIO16 (RX) -> TX on LG40 board
# - GND must be shared between ESP32 and controller board
#
# Serial settings:
# - Baud rate: 9600
# - Data bits: 7
# - Parity: EVEN
# - Stop bits: 1
#
# Notes:
# - Entity names are intentionally in German for Home Assistant usability.
# - Comments/documentation are in English for maintenance consistency.
# - Some commands are marked as "(Test)" until verified on this specific unit.

esphome:
  name: lg250-esp
  friendly_name: LG250 ESP

# Replace this with your actual platform if you aren't using ESP32.
esp32:
  board: esp32dev

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: LG250 ESP Fallback Hotspot
    password: "XhiajwUeN6m6"

captive_portal:

# 1. Load the copied and adapted GitHub component.
external_components:
  - source:
      type: git
      url: https://github.com/gelbetomate/40LG040100
      ref: main  # Load directly from the main branch.
    components: [40lg040100]
    refresh: always # Download component changes on every update.

# 2. Configure serial connection on GPIO16/GPIO17
uart:
  - id: uart_bus
    tx_pin: GPIO17   # Zum RX-Pin der LG40 Steuerplatine
    rx_pin: GPIO16   # Zum TX-Pin der LG40 Steuerplatine
    baud_rate: 9600
    data_bits: 7
    parity: EVEN
    stop_bits: 1

# 3. Enable the 40lg040100 controller integration.
40lg040100:
  uart_id: uart_bus
  reference_profile: lg250      # Use the LG250 profile defined in this repository.
  restore_attempts: 5           # Retry count for write operations.
  enable_unsafe_writes: false   # Keep false for safe initial testing.

sensor:
  - platform: 40lg040100
    # Default profile sensors are created automatically.
    # Adjust the base-sensor behavior here if needed.
    sensors:
      T1:
        deactivate: true # Disabled because a custom sensor with a German label is defined below.
      T2:
        deactivate: true
      T3:
        deactivate: true
      NA:
        # English: Extract fan speed.
        name: "Pichler LG250 Drehzahl Abluft"
        deactivate: false
      NZ:
        # English: Supply fan speed.
        name: "Pichler LG250 Drehzahl Zuluft"
        deactivate: false

    # Existing custom commands remain fully compatible.
    sensors_custom:
      # --- 1. RAW TEMPERATURE VALUES ---
      - command: "T1"
        # English: Outside air temperature before the heat exchanger.
        name: "Pichler LG250 Außenlufttemperatur vor Wärmetauscher"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: "30s"

      - command: "T2"
        # English: Supply air temperature after the heat exchanger.
        name: "Pichler LG250 Zulufttemperatur nach Wärmetauscher"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: "30s"

      - command: "T3"
        # English: Extract air temperature before the heat exchanger.
        name: "Pichler LG250 Ablufttemperatur vor Wärmetauscher"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: "30s"

      - command: "T4"
        # English: Exhaust air temperature after the heat exchanger.
        name: "Pichler LG250 Fortlufttemperatur nach Wärmetauscher"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: "30s"

      # --- 2. SETPOINT TEMPERATURE ---
      - command: "Rd"
        # English: Room temperature setpoint.
        name: "Pichler LG250 Soll-Temperatur Raum"
        unit_of_measurement: "°C"
        device_class: temperature
        update_interval: "60s"
        filters:
          - multiply: 0.1

      - command: "Re"
        # English: Re temperature setpoint (test).
        name: "Pichler LG250 Soll-Temperatur Re (Test)"
        unit_of_measurement: "°C"
        device_class: temperature
        update_interval: "60s"
        filters:
          - multiply: 0.1

      - command: "SP"
        # English: SP temperature setpoint (test).
        name: "Pichler LG250 Soll-Temperatur SP (Test)"
        unit_of_measurement: "°C"
        device_class: temperature
        update_interval: "60s"
        filters:
          - multiply: 0.1

      - command: "Rd"
        # English: Raw Rd temperature setpoint value (test).
        name: "Pichler LG250 Soll-Temperatur Rd Rohwert (Test)"
        update_interval: "60s"

      # --- 3. FILTER REMAINING RUNTIME ---
      - command: "FI"
        # English: Remaining filter runtime.
        name: "Pichler LG250 Filter Restlaufzeit"
        unit_of_measurement: "h"
        state_class: measurement
        update_interval: "2min"

      # --- 4. AIRFLOW RATES ---
      - command: "V1"
        # English: Airflow at ventilation level 1.
        name: "Pichler LG250 Volumenstrom Stufe 1"
        unit_of_measurement: "m³/h"
        update_interval: "2min"

      - command: "V2"
        # English: Airflow at ventilation level 2.
        name: "Pichler LG250 Volumenstrom Stufe 2"
        unit_of_measurement: "m³/h"
        update_interval: "2min"

      - command: "V3"
        # English: Airflow at ventilation level 3 (test).
        name: "Pichler LG250 Volumenstrom Stufe 3 (Test)"
        unit_of_measurement: "m³/h"
        update_interval: "2min"

      # --- 4b. AIRFLOW A/B TESTS ---
      - command: "L1"
        # English: Ventilation level 1 setpoint (test).
        name: "Pichler LG250 Luftstufe 1 Sollwert (Test)"
        unit_of_measurement: "%"
        update_interval: "2min"

      - command: "L2"
        # English: Ventilation level 2 setpoint (test).
        name: "Pichler LG250 Luftstufe 2 Sollwert (Test)"
        unit_of_measurement: "%"
        update_interval: "2min"

      - command: "L3"
        # English: Ventilation level 3 setpoint (test).
        name: "Pichler LG250 Luftstufe 3 Sollwert (Test)"
        unit_of_measurement: "%"
        update_interval: "2min"

      - command: "LS"
        # English: Current ventilation level (test).
        name: "Pichler LG250 Aktuelle Luftstufe (Test)"
        update_interval: "30s"

      - command: "MD"
        # English: Raw operating mode value (test).
        name: "Pichler LG250 Betriebsart Rohwert (Test)"
        update_interval: "30s"

      - command: "ER"
        # English: Controller error code (test).
        name: "Pichler LG250 Fehlercode Leistungsteil (Test)"
        update_interval: "60s"

      # --- 5. ALL OPERATING HOURS ---
      - command: "H1"
        # English: Operating hours, level 1.
        name: "Pichler LG250 Betriebsstunden Stufe 1"
        unit_of_measurement: "h"
        state_class: total_increasing
        update_interval: "5min"

      - command: "H2"
        # English: Operating hours, level 2.
        name: "Pichler LG250 Betriebsstunden Stufe 2"
        unit_of_measurement: "h"
        state_class: total_increasing
        update_interval: "5min"

      - command: "H3"
        # English: Operating hours, level 3.
        name: "Pichler LG250 Betriebsstunden Stufe 3"
        unit_of_measurement: "h"
        state_class: total_increasing
        update_interval: "5min"

      - command: "H4"
        # English: Operating hours, level 4.
        name: "Pichler LG250 Betriebsstunden Stufe 4"
        unit_of_measurement: "h"
        state_class: total_increasing
        update_interval: "5min"

      - command: "HL"
        # English: Total fan operating hours.
        name: "Pichler LG250 Betriebsstunden Lüfter Gesamt"
        unit_of_measurement: "h"
        state_class: total_increasing
        update_interval: "5min"

# --- DIAGNOSTIC RELAYS ---
binary_sensor:
  - platform: 40lg040100
    relais_sensors:
      bedienteil_aktiv:
        # English: Control panel active.
        name: "Pichler LG250 Bedienteil aktiv"
      bedienung_via_rs:
        # English: Control via RS interface.
        name: "Pichler LG250 Bedienung via RS-Schnittstelle"
      luftstufe_vorhanden:
        deactivate: true
      netzrelais_bypass:
        deactivate: true
      vorheizen_aktiv:
        deactivate: true