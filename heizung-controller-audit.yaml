# Pichler LG250 ESPHome Audit Configuration (max. read coverage)
# Goal: expose as many readable registers as possible in Home Assistant.

esphome:
  name: lg250-esp
  friendly_name: LG250 ESP

esp32:
  board: esp32dev

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: LG250 ESP Fallback Hotspot
    password: "XhiajwUeN6m6"

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/gelbetomate/40LG040100
      ref: main
    components: [40lg040100]
    refresh: always

uart:
  - id: uart_bus
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    data_bits: 7
    parity: EVEN
    stop_bits: 1

40lg040100:
  uart_id: uart_bus
  reference_profile: lg250
  restore_attempts: 5
  enable_unsafe_writes: false

sensor:
  - platform: 40lg040100
    reference_profile: lg250

    # Default values can be renamed or disabled here if needed.
    sensors:
      T1:
        deactivate: true
      T2:
        deactivate: true
      T3:
        deactivate: true

    sensors_custom:
      # Plausibility: explicit temperature labels aligned with register definitions.
      - command: "T1"
        # English: Exhaust air temperature (exhaust air path FO).
        name: "LG250 T1 Fortlufttemperatur (Fortluft FO)"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T2"
        # English: Supply air temperature (supply air path ZU).
        name: "LG250 T2 Zulufttemperatur (Zuluft ZU)"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T3"
        # English: Outside air temperature.
        name: "LG250 T3 Aussentemperatur"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T4"
        # English: Extract air / room exhaust temperature.
        name: "LG250 T4 Ablufttemperatur Raum"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T5"
        # English: Exhaust air temperature after the heat exchanger.
        name: "LG250 T5 Nach Waermetauscher Fortluft"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T6"
        # English: Supply air temperature.
        name: "LG250 T6 Zulufttemperatur"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T7"
        # English: Temperature after ground-loop preheating.
        name: "LG250 T7 Nach Solevorerwaermung"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      - command: "T8"
        # English: Temperature after the preheater.
        name: "LG250 T8 Nach Vorheizregister"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        update_interval: 30s

      # Scaled setpoints and raw values for plausibility comparison.
      - command: "Rd"
        # English: Scaled room-temperature setpoint.
        name: "LG250 Rd Raumsollwert skaliert"
        unit_of_measurement: "°C"
        device_class: temperature
        update_interval: 60s
        filters:
          - multiply: 0.1

      - command: "Rd"
        # English: Raw room-temperature setpoint.
        name: "LG250 Rd Raumsollwert roh"
        update_interval: 60s

      - command: "Re"
        # English: Scaled supply-air setpoint.
        name: "LG250 Re Zuluft Sollwert skaliert"
        unit_of_measurement: "°C"
        device_class: temperature
        update_interval: 60s
        filters:
          - multiply: 0.1

      - command: "Re"
        # English: Raw supply-air setpoint.
        name: "LG250 Re Zuluft Sollwert roh"
        update_interval: 60s

      - command: "SP"
        # English: Scaled supply-air temperature setpoint.
        name: "LG250 SP Zuluftsolltemperatur skaliert"
        unit_of_measurement: "°C"
        device_class: temperature
        update_interval: 60s
        filters:
          - multiply: 0.1

      - command: "SP"
        # English: Raw supply-air temperature setpoint.
        name: "LG250 SP Zuluftsolltemperatur roh"
        update_interval: 60s

      # Operating/runtime values.
      - command: "FI"
        # English: Remaining filter runtime.
        name: "LG250 Filter Restlaufzeit"
        unit_of_measurement: "h"
        state_class: measurement
        update_interval: 2min

      - command: "H1"
        # English: Operating hours, level 1.
        name: "LG250 Betriebsstunden Stufe 1"
        unit_of_measurement: "h"
        state_class: total_increasing
        update_interval: 5min

      - command: "H2"
        # English: Operating hours, level 2.
        name: "LG250 Betriebsstunden Stufe 2"
        unit_of_measurement: "h"
        state_class: total_increasing
        update_interval: 5min

      - command: "H3"
        # English: Operating hours, level 3.
        name: "LG250 Betriebsstunden Stufe 3"
        unit_of_measurement: "h"
        state_class: total_increasing
        update_interval: 5min

      - command: "H4"
        # English: Operating hours, level 4.
        name: "LG250 Betriebsstunden Stufe 4"
        unit_of_measurement: "h"
        state_class: total_increasing
        update_interval: 5min

      - command: "HL"
        # English: Total fan operating hours.
        name: "LG250 Betriebsstunden Luefter gesamt"
        unit_of_measurement: "h"
        state_class: total_increasing
        update_interval: 5min

      # Airflow values.
      - command: "V1"
        # English: Airflow at ventilation level 1.
        name: "LG250 Volumenstrom Stufe 1"
        unit_of_measurement: "m3/h"
        update_interval: 2min

      - command: "V2"
        # English: Airflow at ventilation level 2.
        name: "LG250 Volumenstrom Stufe 2"
        unit_of_measurement: "m3/h"
        update_interval: 2min

      - command: "V3"
        # English: Airflow at ventilation level 3.
        name: "LG250 Volumenstrom Stufe 3"
        unit_of_measurement: "m3/h"
        update_interval: 2min

      # Additional reads for infrequently used registers.
      - command: "S1"
        # English: Ground heat exchanger boost share, level 1.
        name: "LG250 S1 EWT Boost Anteil Stufe 1"
        update_interval: 10min

      - command: "S2"
        # English: Ground heat exchanger boost share, level 2.
        name: "LG250 S2 EWT Boost Anteil Stufe 2"
        update_interval: 10min

      - command: "S3"
        # English: Ground heat exchanger boost share, level 3.
        name: "LG250 S3 EWT Boost Anteil Stufe 3"
        update_interval: 10min

      - command: "SM"
        # English: Solar maximum.
        name: "LG250 SM Solar max"
        update_interval: 10min

      - command: "DA"
        # English: Delta-T switch-off threshold.
        name: "LG250 DA Delta T Aus"
        update_interval: 10min

      - command: "DE"
        # English: Delta-T switch-on threshold.
        name: "LG250 DE Delta T Ein"
        update_interval: 10min

      - command: "Tf"
        # English: Utility-company lockout.
        name: "LG250 Tf EVU Sperre"
        update_interval: 10min

text_sensor:
  - platform: 40lg040100
    reference_profile: lg250

binary_sensor:
  - platform: 40lg040100
    relais_sensors:
      kompressor:
        # English: Compressor.
        name: "LG250 Kompressor"
      zusatzheizung:
        # English: Additional heating.
        name: "LG250 Zusatzheizung"
      erdwaermetauscher:
        # English: Ground heat exchanger.
        name: "LG250 Erdwaermetauscher"
      bypass:
        # English: Bypass.
        name: "LG250 Bypass"
      vorheizregister:
        # English: Preheater.
        name: "LG250 Vorheizregister"
      netzrelais_bypass:
        # English: Bypass mains relay.
        name: "LG250 Netzrelais Bypass"
      bedienteil_aktiv:
        # English: Control panel active.
        name: "LG250 Bedienteil aktiv"
      bedienung_via_rs:
        # English: Control via RS interface.
        name: "LG250 Bedienung via RS"
      luftstufe_vorhanden:
        # English: Ventilation level available.
        name: "LG250 Luftstufe vorhanden"
      ww_nachheizregister:
        # English: Domestic-hot-water reheater.
        name: "LG250 Warmwasser Nachheizregister"
      magnetventil:
        # English: Solenoid valve.
        name: "LG250 Magnetventil"
      vorheizen_aktiv:
        # English: Preheating active.
        name: "LG250 Vorheizen aktiv"
